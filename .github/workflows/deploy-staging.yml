# Builds the API/worker image once, ships it to the staging VPS over SSH and deploys it, then
# runs the full release check against staging (PR-010, ADR-0011). The server never builds.
#
# Run it by hand (Actions → Deploy staging → Run workflow), or automatically after the checks pass
# on a push to dev (staging follows dev) when STAGING_AUTO_DEPLOY is "true" on the staging
# environment. Every run that deploys, fails its checks or is stopped posts to Slack when
# SLACK_WEBHOOK_URL is set.
#
# Repository settings → Environments → "staging":
#   secrets:   STAGING_SSH_KEY (private key of the server's deploy user), STAGING_SSH_KNOWN_HOSTS
#              (`ssh-keyscan <server>` output, checked by hand), RELEASE_PREVIEW_PASSWORD,
#              RELEASE_CHECK_TOKEN, RELEASE_OPS_EMAIL, RELEASE_OPS_TOTP_SECRET,
#              SLACK_WEBHOOK_URL (optional; posts deploy status and fix summaries to Slack)
#   variables: STAGING_SSH (deploy@<server>), STAGING_WEB_URL, STAGING_API_URL
name: Deploy staging
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Workspace checks]
    types: [completed]
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # A manual run re-runs every check on the commit first; an automatic run follows a green check.
  checks:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    # A called workflow gets no more than this: CI's `changes` job reads a pull request's files.
    permissions:
      contents: read
      pull-requests: read

  # Environment variables are not readable in a job's `if:` (it is evaluated before the job
  # enters the environment), so the auto-deploy switch is read here, inside the environment.
  # Only pushes to dev count: a pull request whose branch is dev also reports head_branch dev.
  gate:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      go: ${{ steps.switch.outputs.go }}
      checks: ${{ github.event.workflow_run.conclusion }}
    steps:
      - id: switch
        run: echo "go=${{ vars.STAGING_AUTO_DEPLOY == 'true' }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [checks, gate]
    if: >-
      always() &&
      (needs.checks.result == 'success' ||
       (needs.gate.outputs.go == 'true' && needs.gate.outputs.checks == 'success'))
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 40
    # statuses: records the full staging pass on the deployed commit (scripts/staging-pass.mjs).
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history, so the Slack summary can list everything since the deployed version.
          fetch-depth: 0

      - name: Version
        run: echo "VERSION=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      # What staging runs now (public, no secrets), read before it changes. The Slack summary lists
      # the commits from there to this version; without it, it falls back to the last few commits.
      - name: Deployed version
        run: |
          previous=$(curl -fsS --max-time 10 "${{ vars.STAGING_API_URL }}/health/release" | jq -r '.data.version // empty' || true)
          if [[ "$previous" =~ ^[0-9a-f]{7,40}$ ]] && git cat-file -e "$previous^{commit}" 2>/dev/null; then
            echo "PREVIOUS_VERSION=$previous" >> "$GITHUB_ENV"
          fi

      - name: Build the image (once, here)
        run: docker build -f deploy/Dockerfile -t "tipme-app:$VERSION" .

      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging
          chmod 600 ~/.ssh/staging
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship and deploy
        env:
          STAGING_SSH: ${{ vars.STAGING_SSH }}
          STAGING_SSH_KEY_FILE: /home/runner/.ssh/staging
        run: scripts/ship-staging.sh "$VERSION"

      # The release check runs from here, against the deployed copy.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Full once the release-check staff account exists (runbook step 6); read-only before that.
      - name: Release check
        id: release
        env:
          RELEASE_PREVIEW_PASSWORD: ${{ secrets.RELEASE_PREVIEW_PASSWORD }}
          RELEASE_CHECK_TOKEN: ${{ secrets.RELEASE_CHECK_TOKEN }}
          RELEASE_OPS_EMAIL: ${{ secrets.RELEASE_OPS_EMAIL }}
          RELEASE_OPS_TOTP_SECRET: ${{ secrets.RELEASE_OPS_TOTP_SECRET }}
          WEB: ${{ vars.STAGING_WEB_URL }}
          API: ${{ vars.STAGING_API_URL }}
        run: |
          mode=(); full=false
          if [[ -n "$RELEASE_OPS_TOTP_SECRET" && -n "$RELEASE_CHECK_TOKEN" ]]; then mode=(--full); full=true;
          else echo "::warning::Release-check staff not set up yet: running the read-only check only."; fi
          pnpm release:check --web "$WEB" --api "$API" --expect-version "$VERSION" "${mode[@]}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
      # Only a passed --full check counts; the read-only fallback records nothing. Production
      # refuses a main commit whose tree has no such pass. The deployed commit is the checked-out
      # one (dev), not GITHUB_SHA, so it is passed explicitly.
      - name: Record the full staging pass
        if: success() && steps.release.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: RECORD_SHA=$(git rev-parse HEAD) node scripts/staging-pass.mjs record
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-check
          path: test-results/
          retention-days: 7

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/staging

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/notify-slack.mjs \
            --status "${{ job.status }}" \
            --environment "staging" \
            --version "$VERSION" \
            ${PREVIOUS_VERSION:+--commit-range "$PREVIOUS_VERSION..HEAD"} \
            --web-url "${{ vars.STAGING_WEB_URL }}" \
            --api-url "${{ vars.STAGING_API_URL }}" \
            --repo "${{ github.repository }}" \
            --actor "${{ github.actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # The deploy never started: the checks failed on a manual run, or on the dev push it would
  # have followed. Say so in Slack instead of staying silent. (Auto-deploy switched off, or a
  # pull request run, posts nothing.)
  notify-stopped:
    needs: [checks, gate, deploy]
    if: >-
      always() && needs.deploy.result == 'skipped' &&
      (needs.checks.result == 'failure' ||
       (needs.gate.outputs.go == 'true' && needs.gate.outputs.checks == 'failure'))
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 20
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/notify-slack.mjs \
            --status "failure" \
            --environment "staging" \
            --version "$(git rev-parse --short=12 HEAD)" \
            --web-url "${{ vars.STAGING_WEB_URL }}" \
            --api-url "${{ vars.STAGING_API_URL }}" \
            --repo "${{ github.repository }}" \
            --actor "${{ github.actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
