name: Workspace checks
on:
  # A pull request already runs the checks. Push runs them for the long-lived branches only,
  # so a feature branch is not tested twice.
  push:
    branches: [main, dev]
  pull_request:
  # The deploy-staging workflow runs these checks before shipping a version by hand.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Whether the slow suites need to run: a pull request that changes only documentation skips
  # integration, load and e2e. Pushes to dev/main and the staging deploy's own run test everything,
  # unless a pull request run already passed every job on exactly this file tree (`reused`): then
  # every job is skipped, and the run still concludes success, which starts the staging deploy.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      reused: ${{ steps.reuse.outputs.reused }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
        with:
          persist-credentials: false
      - id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-reuse.mjs decide
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR" ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[].filename')
          if printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  static:
    needs: changes
    if: needs.changes.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build, lint, typecheck and test results of unchanged packages are reused from the last
      # run (turbo.json declares every setting that changes a build, so a stale one is never used).
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: docker compose config --quiet
      - name: Staging compose file is valid (placeholders only)
        run: docker compose -f deploy/compose.staging.yml --env-file deploy/staging.env.example config --quiet
        env:
          TIPME_VERSION: 0000000
          TIPME_ENV_FILE: ./staging.env.example
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_RUNTIME_PASSWORD: ci-runtime-placeholder
          POSTGRES_MIGRATOR_PASSWORD: ci-migrator-placeholder
          POSTGRES_BACKUP_PASSWORD: ci-backup-placeholder
          STATUS_TOKEN_SECRET: ci-placeholder-status-token-secret-32-characters
          AUTH_CODE_SECRET: ci-placeholder-auth-code-secret-32-characters
          WEB_REVALIDATE_SECRET: ci-placeholder-revalidate-secret-32-characters
          OPS_TOTP_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          MAIL_SEAL_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BACKUP_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  unit:
    needs: changes
    if: needs.changes.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build, lint, typecheck and test results of unchanged packages are reused from the last
      # run (turbo.json declares every setting that changes a build, so a stale one is never used).
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      # Build first: the script tests import the built packages.
      - run: pnpm build
      - run: pnpm test
      - name: OpenAPI document is current
        run: pnpm api:openapi --check

  security:
    needs: changes
    if: needs.changes.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: a secret removed in a later commit is still leaked.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 turns on pnpm caching by itself (package.json names pnpm). This job
          # installs nothing, so there is no store to save and the post-job step would fail it.
          package-manager-cache: false
      - name: Dependencies with known high or critical vulnerabilities (production only)
        run: pnpm audit --prod --audit-level=high
      - name: Secrets in the repository history (gitleaks, pinned by digest)
        # --redact: a finding names the rule, file and commit, never the value.
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts=--all

  # Test files run in parallel, each in its own copy of a migrated template database
  # (scripts/test-integration.mjs), split across three machines.
  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # them, and record-tested-tree needs it to pass like the rest.
        shard: [1, 2, 3]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait postgres redis
      # Build, lint, typecheck and test results of unchanged packages are reused from the last
      # run (turbo.json declares every setting that changes a build, so a stale one is never used).
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm test:integration
        env:
          TEST_SHARD: ${{ matrix.shard }}/3
          TEST_CONCURRENCY: '3'

  load:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait postgres redis
      # Build, lint, typecheck and test results of unchanged packages are reused from the last
      # run (turbo.json declares every setting that changes a build, so a stale one is never used).
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm exec turbo run build --filter=!@tipme/web
      - name: Load test against PRD §10.1 budgets (k6, pinned; throwaway local API)
        run: pnpm test:load

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `alone` is the @alone tests: its own job and database, so a failure in a shard can't skip
        # them, and record-tested-tree needs it to pass like the rest.
        shard: [1, 2, 3, 4, 5, 6, alone]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/e2e-setup
      # No .next/cache restore: Turbopack reused a compile cache from another commit and built a
      # stylesheet without newer rules (PR #117, run 41991783296: unstyled bank sheet, header not
      # sticky). Every e2e build compiles the web app from scratch.
      - if: matrix.shard != 'alone'
        run: pnpm test:e2e --shard=${{ matrix.shard }}/6
      - if: matrix.shard == 'alone'
        run: pnpm test:e2e --alone
      - name: Upload Playwright PNG diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-png-diagnostics-${{ matrix.shard }}
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3

  # Burn-in: the e2e spec files a pull request adds or changes, five times each with no retries,
  # so a test that passes only sometimes (timers, shared data, a slow runner) fails here instead
  # of in a later pull request. All their tests run, @alone ones included (scripts/run-e2e.mjs).
  # Passes at once when no spec file changed.
  e2e-burn-in:
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.code == 'true' && needs.changes.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_CACHE_DIR: .turbo/cache
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge base with the target branch is needed to tell which spec files changed.
          fetch-depth: 0
          persist-credentials: false
      - id: specs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          # Added, changed or renamed; a deleted file has nothing to run. (A pathspec `*` also
          # matches `/`, so this takes spec files in subfolders too.)
          specs=$(git diff --name-only --diff-filter=AMR "$base" HEAD -- 'tests/e2e/*.spec.ts' | tr '\n' ' ')
          echo "files=$specs" >> "$GITHUB_OUTPUT"
          if [ -z "${specs// }" ]; then
            echo "No e2e spec file added or changed: nothing to burn in." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Burning in (5 runs each, no retries): $specs" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.specs.outputs.files != ''
        uses: ./.github/actions/e2e-setup
      # Through env, not an expression in the script: file names come from the pull request.
      - if: steps.specs.outputs.files != ''
        env:
          SPECS: ${{ steps.specs.outputs.files }}
        run: |
          # One argument per file.
          read -ra files <<< "$SPECS"
          pnpm test:e2e "${files[@]}" --repeat-each=5 --retries=0
      - name: Upload Playwright PNG diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-burn-in-png-diagnostics
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3

  # A pull request run that passed every job, slow suites included, records the file tree it
  # tested on the PR's head commit, so the merge into dev or main can reuse this run.
  # Documentation-only runs (slow suites skipped) record nothing.
  record-tested-tree:
    needs:
      [changes, static, unit, security, integration, load, e2e, e2e-burn-in]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-reuse.mjs record
