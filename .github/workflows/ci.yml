name: Workspace checks
on:
  push:
  pull_request:
  # The deploy-staging workflow runs these checks before shipping a version by hand.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker compose up -d --wait postgres redis
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://tipme_local:tipme_local_password@localhost:5432/tipme_local
      - run: pnpm test:integration
      - run: docker compose config --quiet
      - name: Staging compose file is valid (placeholders only)
        run: docker compose -f deploy/compose.staging.yml --env-file deploy/staging.env.example config --quiet
        env:
          TIPME_VERSION: 0000000
          TIPME_ENV_FILE: ./staging.env.example
          POSTGRES_PASSWORD: ci-placeholder
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
