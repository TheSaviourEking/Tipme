# Watches production every 5 minutes: API ready, web up, payments live only when switched on,
# reserve not low, Bachs webhook rejecting unsigned calls. A failed run emails the repository
# owner through GitHub notifications and posts to the repository secret `ALERT_WEBHOOK_URL`
# (Slack or any {"text": ...} webhook).
# Repository-level settings, not the `production` environment: the job's `if` cannot see
# environment variables. PRODUCTION_PAYMENTS_LIVE (true|false) is set when payments go live.
name: Production watch
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-watch
  cancel-in-progress: true
jobs:
  watch:
    # Only once production exists (repository variable PRODUCTION_API_URL is set).
    if: vars.PRODUCTION_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/watch-production.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check production
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          PRODUCTION_PAYMENTS_LIVE: ${{ vars.PRODUCTION_PAYMENTS_LIVE }}
        run: node scripts/watch-production.mjs --web "$PRODUCTION_WEB_URL" --api "$PRODUCTION_API_URL"
