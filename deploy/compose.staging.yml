# TipMe staging (PR-010): API, worker, Postgres, Redis and Caddy on one server.
# The web app runs on Vercel. Only Caddy is published (80/443); everything else is internal.
#
#   TIPME_VERSION=<git sha> docker compose -f deploy/compose.staging.yml --env-file /srv/tipme/staging.env up -d
name: tipme-staging

x-app: &app
  image: tipme-app:${TIPME_VERSION:?set TIPME_VERSION to the git sha}
  restart: unless-stopped
  read_only: true
  tmpfs: ['/tmp']
  security_opt: ['no-new-privileges:true']
  networks: [internal]

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      API_HOST: ${API_HOST:?set API_HOST, e.g. api.staging.example.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for certificate notices}
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, internal]
    depends_on: [api]
    mem_limit: 128m

  api:
    <<: *app
    command:
      [
        'node',
        '--import',
        './apps/api/dist/instrument.js',
        'apps/api/dist/main.js',
      ]
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-production}
      PREVIEW_PASSWORD: ${PREVIEW_PASSWORD:-}
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      RELEASE_KIND: ${RELEASE_KIND:-live}
      GIT_SHA: ${TIPME_VERSION}
      RELEASE_CHECK_TOKEN: ${RELEASE_CHECK_TOKEN:-}
      PREVIEW_COOKIE_DOMAIN: ${PREVIEW_COOKIE_DOMAIN:-}
      PORT: ${PORT:-4000}
      DATABASE_URL: postgres://tipme_runtime:${POSTGRES_RUNTIME_PASSWORD:?}@postgres:5432/tipme
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1}
      API_METRICS_PORT: ${API_METRICS_PORT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DIAGNOSTICS_ENABLED: ${DIAGNOSTICS_ENABLED:-false}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-tipme}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENTS_LIVE_ENABLED: ${PAYMENTS_LIVE_ENABLED:-false}
      MOCK_PROVIDER_WEBHOOK_SECRET: ${MOCK_PROVIDER_WEBHOOK_SECRET:-}
      BACHS_SANDBOX_API_KEY: ${BACHS_SANDBOX_API_KEY:-}
      BACHS_WEBHOOK_SECRET: ${BACHS_WEBHOOK_SECRET:-}
      BACHS_PREVIOUS_WEBHOOK_SECRET: ${BACHS_PREVIOUS_WEBHOOK_SECRET:-}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      STATUS_TOKEN_SECRET: ${STATUS_TOKEN_SECRET:?}
      RATE_LIMIT_QUOTES_PER_MIN: ${RATE_LIMIT_QUOTES_PER_MIN:-30}
      RATE_LIMIT_INTENTS_PER_MIN: ${RATE_LIMIT_INTENTS_PER_MIN:-10}
      RATE_LIMIT_HANDLES_PER_MIN: ${RATE_LIMIT_HANDLES_PER_MIN:-60}
      RATE_LIMIT_ANALYTICS_PER_MIN: ${RATE_LIMIT_ANALYTICS_PER_MIN:-120}
      RATE_LIMIT_REPORTS_PER_HOUR: ${RATE_LIMIT_REPORTS_PER_HOUR:-10}
      RATE_LIMIT_AVATARS_PER_HOUR: ${RATE_LIMIT_AVATARS_PER_HOUR:-20}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-}
      RATE_LIMIT_AUTH_PER_HOUR: ${RATE_LIMIT_AUTH_PER_HOUR:-10}
      RATE_LIMIT_CODES_PER_NUMBER_PER_HOUR: ${RATE_LIMIT_CODES_PER_NUMBER_PER_HOUR:-3}
      AUTH_CODE_SECRET: ${AUTH_CODE_SECRET:?}
      MAIL_DEFAULT_PROVIDER: ${MAIL_DEFAULT_PROVIDER:-mock}
      WEB_REVALIDATE_SECRET: ${WEB_REVALIDATE_SECRET:?}
      WEB_REVALIDATE_URL: ${WEB_REVALIDATE_URL:-}
      OPS_TOTP_KEY: ${OPS_TOTP_KEY:?}
      MAIL_SEAL_KEY: ${MAIL_SEAL_KEY:?}
      OPS_TRACE_URL_TEMPLATE: ${OPS_TRACE_URL_TEMPLATE:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    # Needs the internet only to tell the web app (Vercel) that a public page changed.
    networks: [edge, internal]

  worker:
    <<: *app
    # The worker asks the payment provider (Bachs) whether tips were paid, so it needs a route
    # out; it still publishes nothing and is reachable only from the internal network.
    networks: [edge, internal]
    command:
      [
        'node',
        '--import',
        './apps/worker/dist/instrument.js',
        'apps/worker/dist/main.js',
      ]
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-production}
      PREVIEW_PASSWORD: ${PREVIEW_PASSWORD:-}
      NODE_ENV: ${NODE_ENV:-production}
      RELEASE_KIND: ${RELEASE_KIND:-live}
      DATABASE_URL: postgres://tipme_runtime:${POSTGRES_RUNTIME_PASSWORD:?}@postgres:5432/tipme
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-tipme}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENTS_LIVE_ENABLED: ${PAYMENTS_LIVE_ENABLED:-false}
      BACHS_SANDBOX_API_KEY: ${BACHS_SANDBOX_API_KEY:-}
      MAIL_SEAL_KEY: ${MAIL_SEAL_KEY:?}
      MAIL_DEFAULT_PROVIDER: ${MAIL_DEFAULT_PROVIDER:-mock}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@staging-mail.usetipme.xyz}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TipMe Staging}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-support@usetipme.xyz}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      GIT_SHA: ${TIPME_VERSION}
      # The safety net when neither a webhook nor the open receipt confirmed a tip: a paid tip is
      # found within about 65 s. The minimum age also marks starts and account creations still in
      # progress as uncertain, so it stays above a few 10-second Bachs requests in a row.
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-20000}
      RECONCILE_MIN_AGE_MS: ${RECONCILE_MIN_AGE_MS:-45000}
      REWARD_CASH_BUDGET_MINOR_PER_MONTH: ${REWARD_CASH_BUDGET_MINOR_PER_MONTH:-25000000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 512m

  # Run by deploy.sh before switching versions: guarded, after a fresh backup.
  migrate:
    <<: *app
    restart: 'no'
    profiles: [tools]
    depends_on:
      postgres: { condition: service_healthy }
    command: ['node', 'packages/database/dist/scripts/release-migrate.js']
    environment:
      GIT_SHA: ${TIPME_VERSION}
      DATABASE_URL: postgres://tipme_migrator:${POSTGRES_MIGRATOR_PASSWORD:?}@postgres:5432/tipme
      MIGRATE_CONFIRM_DATABASE: ${MIGRATE_CONFIRM_DATABASE:-}
      MIGRATE_BACKUP_DONE: ${MIGRATE_BACKUP_DONE:-}

  # Nightly encrypted backups (and on demand: `run --rm backup once`).
  backup:
    <<: *app
    command: ['sh', 'deploy/backup-loop.sh']
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ['${TIPME_BACKUP_DIR:-/srv/tipme/backups}:/backups']
    environment:
      DATABASE_URL: postgres://tipme_backup:${POSTGRES_BACKUP_PASSWORD:?}@postgres:5432/tipme
      BACKUP_KEY: ${BACKUP_KEY:?}
      GIT_SHA: ${TIPME_VERSION}
      BACKUP_RETAIN: ${BACKUP_RETAIN:-14}
      BASE_BACKUP_RETAIN: ${BASE_BACKUP_RETAIN:-7}
    read_only: false
    mem_limit: 384m

  # Rare restore drills/incidents need database-creation privileges; never run continuously.
  restore:
    <<: *app
    restart: 'no'
    profiles: [tools]
    command: ['node', 'packages/database/dist/scripts/restore-drill.js']
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://tipme:${POSTGRES_PASSWORD:?}@postgres:5432/tipme
      BACKUP_KEY: ${BACKUP_KEY:?}
    volumes: ['${TIPME_BACKUP_DIR:-/srv/tipme/backups}:/backups']
    read_only: false
    mem_limit: 384m

  # Optional off-server copy of the encrypted backups and the WAL archive (any S3-compatible
  # bucket), every 15 minutes: <remote>/backups and <remote>/wal.
  # Configure the rclone remote with RCLONE_CONFIG_<NAME>_* settings in offsite.env, then
  # start with `--profile offsite`.
  offsite:
    image: rclone/rclone:1.71.1
    profiles: [offsite]
    restart: unless-stopped
    env_file:
      - path: ${TIPME_OFFSITE_ENV_FILE:-/srv/tipme/offsite.env}
        required: false
    entrypoint: ['sh', '/offsite-loop.sh']
    volumes:
      - '${TIPME_BACKUP_DIR:-/srv/tipme/backups}:/backups:ro'
      - walarchive:/wal:ro
      - ./scripts/offsite-loop.sh:/offsite-loop.sh:ro
    networks: [edge]
    mem_limit: 128m

  postgres:
    image: postgres:16.13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tipme
      POSTGRES_USER: tipme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?}
    # Point-in-time recovery (PR-011): every finished WAL segment is archived to /wal, at least
    # every 5 minutes while anything changes, so at most about 5 minutes of data can be lost.
    entrypoint:
      - sh
      - -c
      - 'mkdir -p /wal && chown postgres:postgres /wal && exec docker-entrypoint.sh "$$@"'
      - --
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=/bin/sh /etc/postgresql/archive-wal.sh %p %f
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/archive-wal.sh:/etc/postgresql/archive-wal.sh:ro
      - ./postgres/bootstrap-roles.sh:/opt/tipme/bootstrap-roles.sh:ro
      - ./postgres/roles.sql:/opt/tipme/roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tipme -d tipme']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]
    mem_limit: 1g

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '192mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [internal]
    mem_limit: 256m

networks:
  edge: {}
  # No internet route at all: Postgres, Redis and the worker are reachable only from here.
  internal: { internal: true }

volumes:
  pgdata:
  walarchive:
  redisdata:
  caddy_data:
  caddy_config:
