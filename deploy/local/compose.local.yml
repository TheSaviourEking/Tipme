# Local override for proving the staging stack on a laptop (PR-010). Not used on the server.
# On the server the edge Caddy (deploy/edge) is a separate Compose project; locally one Caddy,
# with Caddy's own local CA, joins this project so a single command brings everything up.
services:
  caddy:
    image: caddy:2.10.2-alpine
    ports: ['127.0.0.1:8443:8443', '127.0.0.1:8080:8080']
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ${CADDYFILE:?set CADDYFILE}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge-staging]
    depends_on: [api]
  api:
    # The local web server (standing in for Vercel's server side) reaches the API here.
    ports: ['127.0.0.1:4500:4000']
    extra_hosts: ['host.docker.internal:host-gateway']

networks:
  # Locally the network belongs to this project instead of being created on the server.
  edge-staging: !override {}

volumes:
  caddy_data:
  caddy_config:
