      </div>
    </section>
    <aside aria-label="Preview of your page" style="background: #fffefa; border: 1px solid rgba(20,18,16,.09); border-radius: 26px; overflow: hidden; box-shadow: 0 2px 3px rgba(20,18,16,.1), 0 24px 56px -12px rgba(20,18,16,.22)">

      <div style="padding: 0 24px 26px">
        <img src="/_blob/5ce444bee12c51d4fe7f0f086f972214" alt="" style="display: block; width: 96px; height: 96px; margin-top: -48px; position: relative; border-radius: 50%; object-fit: cover; object-position: 50% 12%; border: 4px solid #fffefa; box-sizing: border-box">
        <h2 style="margin: 12px 0 0; font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: 38px; line-height: 1">Ada Okafor</h2>
        <p style="margin: 6px 0 0; font-size: 14px; color: #5d5a54">usetipme.xyz/@ada</p>
        <p style="margin: 12px 0 18px; font-size: 16px; font-weight: 700">Maths tutor</p>
